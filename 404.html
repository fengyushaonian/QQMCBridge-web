<!DOCTYPE html>
<!-- QQMCBridge+ 官网 404 页（GitHub Pages 找不到路径时显示）-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · QQMCBridge+</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3d3938;
      color: #fcf5f1;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .box { text-align: center; padding: 40px 24px; max-width: 560px; }
    .pixel {
      font-family: "MinecraftTen", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: #86d562;
      font-size: clamp(64px, 16vw, 120px);
      line-height: 1;
      text-shadow: 4px 4px 0 rgba(0, 0, 0, .5);
      letter-spacing: .02em;
    }
    h1 { font-size: 22px; margin: 18px 0 10px; color: #fff; }
    p { font-size: 14px; color: #aba09c; line-height: 1.7; margin-bottom: 26px; }
    a.home {
      display: inline-block;
      padding: 12px 26px;
      background: linear-gradient(180deg, #6cc349, #52a535 50%, #3c8527);
      border: 2px solid #171615;
      border-radius: 4px;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .28), 3px 3px 0 rgba(0, 0, 0, .35);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .02em;
    }
    a.home:hover { background: linear-gradient(180deg, #86d562, #6cc349 50%, #52a535); }
    .repos { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .repos a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(252, 245, 241, .08);
      border: 2px solid #6b6562;
      border-radius: 999px;
      color: #d0c5c0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .repos a:hover { color: #86d562; border-color: #52a535; background: rgba(108, 195, 73, .14); }
  </style>
</head>
<body>
  <div class="box">
    <div class="pixel">404</div>
    <h1>挖错地方了……这里只有基岩</h1>
    <p>页面不存在，或者已经被移动了。回官网首页看看吧，那边有 QQ 群和 Minecraft 在等着你。</p>
    <a class="home" href="index.html">返回 QQMCBridge+ 首页</a>
    <div class="repos">
      <a href="https://github.com/fengyushaonian/QQMCBridgeplus-LSE" target="_blank" rel="noopener noreferrer">QQMCBridgeplus-LSE</a>
      <a href="https://github.com/fengyushaonian/QQMCBridgeplus_python-adaptar" target="_blank" rel="noopener noreferrer">QQMCBridgeplus_python-adaptar</a>
      <a href="https://github.com/JERC-STUDIO/QQMCBridge" target="_blank" rel="noopener noreferrer">QQMCBridge（原版）</a>
    </div>
  </div>
</body>
</html>
